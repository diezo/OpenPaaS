version: 2
project_name: op

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: op
    main: ./cmd/op
    binary: op
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/openpaas/openpaas/internal/cli.version={{.Version}}
      - -X github.com/openpaas/openpaas/internal/cli.commit={{.ShortCommit}}
      - -X github.com/openpaas/openpaas/internal/cli.date={{.Date}}

archives:
  # No version in the file name, so install.sh can use releases/latest/download/.
  - name_template: "op_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: [LICENSE*, README*]

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
