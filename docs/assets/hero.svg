<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="op create deploys multiple services on one VM, each on its own subdomain">
  <style>
    .mono { font-family: 'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace; }
  </style>

  <rect width="1280" height="640" fill="#fbf9f5"/>

  <!-- wordmark -->
  <circle cx="86" cy="90" r="13" fill="#c9825b"/>
  <text x="112" y="101" class="mono" font-size="32" font-weight="700" fill="#2b2622">openpaas</text>

  <!-- terminal -->
  <rect x="70" y="235" width="360" height="170" rx="16" fill="#2b2622"/>
  <circle cx="98" cy="263" r="6" fill="#c9825b"/>
  <circle cx="120" cy="263" r="6" fill="#d4b06a"/>
  <circle cx="142" cy="263" r="6" fill="#9fae94"/>
  <text x="102" y="332" class="mono" font-size="32" font-weight="600" fill="#f4ede2"><tspan fill="#8a7d70">$</tspan> op create</text>
  <text x="102" y="378" class="mono" font-size="20" fill="#9fae94">✓ app.yourdomain.com</text>

  <!-- arrow -->
  <line x1="442" y1="320" x2="534" y2="320" stroke="#2b2622" stroke-width="2"/>
  <path d="M546 320 L532 311 V329 Z" fill="#2b2622"/>

  <!-- VM -->
  <rect x="570" y="110" width="650" height="420" rx="20" fill="#efe6d9" stroke="#2b2622" stroke-width="2"/>
  <line x1="570" y1="166" x2="1220" y2="166" stroke="#2b2622" stroke-width="2"/>
  <text x="600" y="146" class="mono" font-size="20" font-weight="700" fill="#8a7d70">VM</text>
  <circle cx="1128" cy="138" r="5" fill="#7d9a6b"/>
  <circle cx="1148" cy="138" r="5" fill="#7d9a6b"/>
  <circle cx="1168" cy="138" r="5" fill="#c9825b"/>
  <circle cx="1188" cy="138" r="5" fill="#d4b06a"/>

  <!-- services -->
  <g class="mono" font-size="24" fill="#2b2622">
    <rect x="600" y="190" width="590" height="72" rx="12" fill="#fbf9f5" stroke="#2b2622" stroke-width="1.5"/>
    <rect x="618" y="206" width="40" height="40" rx="10" fill="#c9825b"/>
    <rect x="630" y="218" width="16" height="16" rx="3" fill="none" stroke="#fbf9f5" stroke-width="2.5"/>
    <text x="680" y="234">app.yourdomain.com</text>
    <circle cx="1160" cy="226" r="7" fill="#7d9a6b"/>

    <rect x="600" y="274" width="590" height="72" rx="12" fill="#fbf9f5" stroke="#2b2622" stroke-width="1.5"/>
    <rect x="618" y="290" width="40" height="40" rx="10" fill="#9fae94"/>
    <rect x="630" y="302" width="16" height="16" rx="3" fill="none" stroke="#fbf9f5" stroke-width="2.5"/>
    <text x="680" y="318">api.yourdomain.com</text>
    <circle cx="1160" cy="310" r="7" fill="#7d9a6b"/>

    <rect x="600" y="358" width="590" height="72" rx="12" fill="#fbf9f5" stroke="#2b2622" stroke-width="1.5"/>
    <rect x="618" y="374" width="40" height="40" rx="10" fill="#d4a59a"/>
    <rect x="630" y="386" width="16" height="16" rx="3" fill="none" stroke="#fbf9f5" stroke-width="2.5"/>
    <text x="680" y="402">blog.yourdomain.com</text>
    <circle cx="1160" cy="394" r="7" fill="#7d9a6b"/>

    <rect x="600" y="442" width="590" height="72" rx="12" fill="none" stroke="#8a7d70" stroke-width="1.5" stroke-dasharray="8 7"/>
    <text x="680" y="486" fill="#8a7d70">+ op create</text>
  </g>
</svg>
